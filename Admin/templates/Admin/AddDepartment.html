{% extends 'Admin/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html>

<head>
    <title>Add Department</title>
</head>

<style>
    #main {
        min-height: 100vh;
        padding: 40px 20px;
        background: #08080d;
        color: #f5f5f7;
    }

    .department-form-container {
        max-width: 600px;
        margin: 0 auto;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 25px;
        color: #b7b7c5;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
    }

    .back-link:hover {
        color: #a78bfa;
    }

    .form-card {
        padding: 35px;
        background: #11111a;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .form-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        margin-bottom: 22px;
        border-radius: 14px;
        color: #c4b5fd;
        background: rgba(139, 92, 246, 0.15);
        font-size: 27px;
    }

    .form-card h3 {
        margin-bottom: 8px;
        color: #f5f5f7;
        font-size: 25px;
        font-weight: 700;
    }

    .form-subtitle {
        margin-bottom: 30px;
        color: #b7b7c5;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 9px;
        color: #e5e5ed;
        font-size: 14px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        outline: none;
        background: #0d0d14;
        color: #f5f5f7;
        font-size: 14px;
        transition: 0.2s;
    }

    .form-group input::placeholder {
        color: #777787;
    }

    .form-group input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.13);
    }

    .submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        padding: 13px;
        margin-top: 8px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #8b5cf6, #477dff);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(139, 92, 246, 0.25);
    }

    @media (max-width: 576px) {
        #main {
            padding: 25px 15px;
        }

        .form-card {
            padding: 25px 20px;
        }
    }

    .form-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        padding: 0;
        box-sizing: border-box;
    }

    .form-icon i {
        display: block;
        line-height: 1;
        margin: 0;
        padding: 0;
        font-size: 26px;
    }
</style>

<body>
    <div id="main">
        <div class="department-form-container">

            <a href="{% url 'Admin:Departments' %}" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Departments
            </a>

            <div class="form-card">
                <div class="form-icon">
                    <i class="bi bi-building"></i>
                </div>

                <h3>Add Department</h3>
                <p class="form-subtitle">Register a new academic department.</p>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="dept_name">Department Name</label>
                        <input type="text" id="dept_name" name="dept_name" placeholder="Enter department name" required>
                    </div>

                    <div class="form-group">
                        <label for="dept_code">Department Code</label>
                        <input type="text" id="dept_code" name="dept_code" placeholder="Enter department code" required>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="bi bi-plus"></i> Add Department
                    </button>
                </form>
            </div>

        </div>
    </div>
</body>

</html>
{% endblock %}
