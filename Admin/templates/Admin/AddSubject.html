{% extends 'Admin/Header.html' %}

{% block content %}
<!DOCTYPE html>
<html>

<head>
    <title>Add Subject</title>
</head>

<style>
    #main {
        min-height: 100vh;
        padding: 45px 20px;
        background:
            radial-gradient(ellipse at 15% 10%, rgba(139, 92, 246, 0.10), transparent 40%),
            radial-gradient(ellipse at 90% 90%, rgba(71, 125, 255, 0.08), transparent 35%),
            #08080d;
        color: #f5f5f7;
    }

    .subject-form-container {
        width: 100%;
        max-width: 570px;
        margin: 0 auto;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 24px;
        color: #a7a7b8;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: #c4b5fd;
    }

    .form-card {
        position: relative;
        overflow: hidden;
        padding: 36px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 20px;
        background: linear-gradient(145deg, #14141f, #0e0e16);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.30);
    }

    .form-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #8b5cf6, #477dff, #a78bfa);
    }

    .form-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 25px;
    }

    .form-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 16px;
        background: linear-gradient(
            135deg,
            rgba(139, 92, 246, 0.20),
            rgba(71, 125, 255, 0.10)
        );
        color: #c4b5fd;
        font-size: 25px;
    }

    .form-badge {
        padding: 7px 11px;
        border: 1px solid rgba(139, 92, 246, 0.20);
        border-radius: 30px;
        background: rgba(139, 92, 246, 0.08);
        color: #bda5ff;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.3px;
    }

    .form-card h3 {
        margin-bottom: 9px;
        color: #f5f5f7;
        font-size: 28px;
        font-weight: 750;
        letter-spacing: -0.7px;
    }

    .form-subtitle {
        margin-bottom: 30px;
        color: #9292a5;
        font-size: 13px;
        line-height: 1.7;
    }

    .form-group {
        margin-bottom: 23px;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        color: #dedee8;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper > i:first-child {
        position: absolute;
        left: 15px;
        z-index: 1;
        color: #88889f;
        font-size: 16px;
        pointer-events: none;
    }

    .input-wrapper input,
    .input-wrapper select {
        width: 100%;
        height: 51px;
        padding: 0 15px 0 44px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 10px;
        outline: none;
        background: #0a0a12;
        color: #f5f5f7;
        font-family: inherit;
        font-size: 13px;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .input-wrapper input::placeholder {
        color: #666679;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
        border-color: #8b5cf6;
        background: #0d0b17;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .input-wrapper select {
        appearance: none;
        padding-right: 42px;
        cursor: pointer;
    }

    .input-wrapper select option {
        background: #11111a;
        color: #f5f5f7;
    }

    .select-arrow {
        position: absolute;
        right: 15px;
        color: #88889f;
        font-size: 13px;
        pointer-events: none;
    }

    .submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 52px;
        margin-top: 30px;
        padding: 13px 18px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(110deg, #8b5cf6, #6555e8 55%, #477dff);
        box-shadow: 0 8px 22px rgba(108, 83, 235, 0.20);
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(108, 83, 235, 0.32);
        filter: brightness(1.08);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    .button-arrow {
        margin-left: auto;
        font-size: 16px;
    }

    .form-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 23px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        color: #77778b;
        font-size: 11px;
    }

    .form-footer i {
        color: #a78bfa;
        font-size: 14px;
    }

    .page-brand {
        margin-top: 25px;
        color: #f5f5f7;
        text-align: center;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.4px;
    }

    .page-brand span:last-of-type {
        color: #a78bfa;
    }

    .page-brand .brand-dot {
        color: #477dff;
    }

    @media (max-width: 576px) {
        #main {
            padding: 25px 14px;
        }

        .form-card {
            padding: 26px 20px;
            border-radius: 15px;
        }

        .form-card h3 {
            font-size: 24px;
        }

        .form-badge {
            font-size: 8px;
            letter-spacing: 0.8px;
        }
    }
</style>

<body>
    <div id="main">
        <div class="subject-form-container">

            <a href="{% url 'Admin:Subjects' %}" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Subjects
            </a>

            <div class="form-card">
                <div class="form-top">
                    <div class="form-icon">
                        <i class="bi bi-journal-plus"></i>
                    </div>
                    <span class="form-badge">ACADEMIC MANAGEMENT</span>
                </div>

                <h3>Add New Subject</h3>
                <p class="form-subtitle">
                    Create a subject and assign it to its department.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="subject_name">Subject Name</label>
                        <div class="input-wrapper">
                            <i class="bi bi-book"></i>
                            <input type="text" id="subject_name" name="subject_name" placeholder="e.g. Data Structures"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject_code">Subject Code</label>
                        <div class="input-wrapper">
                            <i class="bi bi-upc-scan"></i>
                            <input type="text" id="subject_code" name="subject_code" placeholder="e.g. MCA101" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <div class="input-wrapper select-wrapper">
                            <i class="bi bi-building"></i>
                            <select id="department" name="department" required>
                                <option value="">Select a department</option>

                                {% for department in departments %}
                                <option value="{{ department.dept_id }}">
                                    {{ department.dept_name }} ({{ department.dept_code }})
                                </option>
                                {% endfor %}
                            </select>
                            <i class="bi bi-chevron-down select-arrow"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="bi bi-plus-circle"></i>
                        Add Subject
                        <i class="bi bi-arrow-right button-arrow"></i>
                    </button>
                </form>

                <div class="form-footer">
                    <i class="bi bi-shield-check"></i>
                    Subject details will be saved to ScriptVision.
                </div>
            </div>

            <p class="page-brand">
                <span>Script</span><span>Vision</span>
                <span class="brand-dot">.</span>
            </p>

        </div>
    </div>
</body>

</html>
{% endblock %}
