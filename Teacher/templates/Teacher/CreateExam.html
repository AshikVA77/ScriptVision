{% extends 'Teacher/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Exam - Script Vision</title>

</head>

<style>
    /* =================================
   Create Exam
================================= */

    .sv-create-exam-page {
        min-height: 75vh;
        padding: 80px 20px;
    }

    .sv-create-exam-container {
        max-width: 750px;
        margin: 0 auto;
    }


    /* Header */

    .sv-create-exam-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .sv-create-exam-header h2 {
        margin: 0 0 10px;
        color: var(--tx);
        font-size: 2rem;
        font-weight: 700;
    }

    .sv-create-exam-header p {
        margin: 0;
        color: var(--tx3);
        font-size: 0.95rem;
    }


    /* Card */

    .sv-create-exam-card {
        background: var(--bg3);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }


    /* Fields */

    .sv-create-exam-field {
        margin-bottom: 21px;
    }

    .sv-create-exam-field label {
        display: block;
        margin-bottom: 8px;
        color: var(--tx2);
        font-size: 0.88rem;
        font-weight: 500;
    }

    .sv-create-exam-field input,
    .sv-create-exam-field select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: var(--bg2);
        color: var(--tx);
        font-size: 0.92rem;
        outline: none;
        transition: 0.25s ease;
    }

    .sv-create-exam-field input::placeholder {
        color: var(--tx3);
    }

    .sv-create-exam-field input:focus,
    .sv-create-exam-field select:focus {
        border-color: var(--pur);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .sv-create-exam-field select option {
        background: var(--bg3);
        color: var(--tx);
    }


    /* Date Input */

    .sv-create-exam-field input[type="date"] {
        color-scheme: dark;
    }


    /* Actions */

    .sv-create-exam-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .sv-create-exam-cancel {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 20px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--tx2);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: 0.25s ease;
    }

    .sv-create-exam-cancel:hover {
        color: var(--tx);
        background: rgba(255, 255, 255, 0.05);
    }

    .sv-create-exam-submit {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 20px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--pur), #7c3aed);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s ease;
    }

    .sv-create-exam-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25);
    }


    /* Responsive */

    @media (max-width: 768px) {

        .sv-create-exam-page {
            padding: 50px 15px;
        }

        .sv-create-exam-header h2 {
            font-size: 1.6rem;
        }

        .sv-create-exam-card {
            padding: 25px 18px;
        }
    }

    @media (max-width: 480px) {

        .sv-create-exam-page {
            padding: 40px 12px;
        }

        .sv-create-exam-card {
            padding: 22px 15px;
        }

        .sv-create-exam-actions {
            flex-direction: column-reverse;
        }

        .sv-create-exam-cancel,
        .sv-create-exam-submit {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<body>

    <center>
        <div class="sv-create-exam-page">

            <div class="sv-create-exam-container">

                <div class="sv-create-exam-header">
                    <h2>Create Exam</h2>
                    <p>Enter the details below to create a new examination.</p>
                </div>

                <div class="sv-create-exam-card">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Exam Name -->
                        <div class="sv-create-exam-field">

                            <label for="exam_name">
                                Exam Name
                            </label>

                            <input type="text" id="exam_name" name="exam_name" placeholder="Enter exam name" required>

                        </div>


                        <!-- Subject -->
                        <div class="sv-create-exam-field">

                            <label for="subject">
                                Subject
                            </label>

                            <select name="subject" id="subject" required>

                                <option value="">
                                    Select Subject
                                </option>

                                {% for subject in subjects %}

                                <option value="{{ subject.subject_id }}">
                                    {{ subject.subject_name }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Exam Type -->
                        <div class="sv-create-exam-field">

                            <label for="exam_type">
                                Exam Type
                            </label>

                            <input type="text" id="exam_type" name="exam_type"
                                placeholder="Internal / Model / University" required>

                        </div>


                        <!-- Exam Date -->
                        <div class="sv-create-exam-field">

                            <label for="exam_date">
                                Exam Date
                            </label>

                            <input type="date" id="exam_date" name="exam_date" required>

                        </div>


                        <!-- Academic Year -->
                        <div class="sv-create-exam-field">

                            <label for="academic_year">
                                Academic Year
                            </label>

                            <input type="text" id="academic_year" name="academic_year" placeholder="2026-27" required>

                        </div>


                        <!-- Total Marks -->
                        <div class="sv-create-exam-field">

                            <label for="total_marks">
                                Total Marks
                            </label>

                            <input type="number" id="total_marks" name="total_marks" min="1"
                                placeholder="Enter total marks" required>

                        </div>


                        <!-- Actions -->
                        <div class="sv-create-exam-actions">

                            <a href="{% url 'Teacher:Teacherhome' %}" class="sv-create-exam-cancel">
                                Cancel
                            </a>

                            <button type="submit" class="sv-create-exam-submit">
                                <i class="fa-solid fa-plus"></i>
                                Create Exam
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </center>

</body>

</html>

{% endblock %}
