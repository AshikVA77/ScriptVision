<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Vision - Teacher Register</title>

    <style>
        table {
            width: 50%;
        }

        td {
            padding: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 70%;
            padding: 8px;
        }

        .btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

<center>

    <h1>Teacher Registration</h1>

    <form method="POST" action="" enctype="multipart/form-data">
        {% csrf_token %}

        <table>

            <tr>
                <td><label for="name">Name:</label></td>
                <td><input type="text" id="name" name="thname" required></td>
            </tr>

            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="themail" required></td>
            </tr>

            <tr>
                <td><label for="phone">Phone:</label></td>
                <td><input type="tel" id="phone" name="thphone" required></td>
            </tr>

            <tr>
                <td><label for="department">Department:</label></td>
                <td>
                    <select id="department" name="thdepartment" required>
                        <option value="" selected disabled>Select Department</option>
                        <option value="CS">Computer Science</option>
                        <option value="IT">Information Technology</option>
                        <option value="AI">Artificial Intelligence</option>
                        <option value="ECE">Electronics and Communication</option>
                        <option value="EEE">Electrical and Electronics</option>
                        <option value="ME">Mechanical Engineering</option>
                        <option value="CE">Civil Engineering</option>
                        <option value="Architecture">Architecture</option>
                        <option value="MCA">Master of Computer Applications (MCA)</option>
                        <option value="MBAs">Master of Business Administration (MBA)</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="thpassword" required></td>
            </tr>

            <tr>
                <td><label for="confirm_password">Confirm Password:</label></td>
                <td><input type="password" id="confirm_password" name="thconfirm_password" required></td>
            </tr>

            <tr>
                <td><label for="profile_pic">Profile Picture:</label></td>
                <td><input type="file" id="profile_pic" name="thprofile_pic" accept="image/*"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" class="btn" value="Register">
                </td>
            </tr>

            <tr>
                        <td align="center"><a href="{% url 'Guest:Login' %}">Already have an account? &nbsp;Login here</a></td>
            </tr>
            
        </table>

    </form>

</center>

</body>
</html>
